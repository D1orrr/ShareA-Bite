<div class="card hero lt" style="align-self:start;position:sticky;top:20px"><div class="row sp"><span class="cap">Estimasi total</span><span class="cap m">dari ${R(S.shopB)}</span></div><div class="pxl" style="color:var(--ink);margin:6px 0 12px">${R(t)}</div><div class="bar"><i style="width:${Math.min(100,t/S.shopB*100)}%;background:${c}"></i></div><div style="margin:10px 0 16px;font-weight:700;color:${t>S.shopB?'#C62828':'var(--daun)'}">${t>S.shopB?'Lewat '+R(t-S.shopB):'Sisa '+R(S.shopB-t)+'. Masih cukup nih.'} ${l}</div><a class="btn w" href="#/spots">${I('pin')} Cari tempat murah</a></div></div>`},
komunitas:()=>{const f=S.tab,L=(k,n)=>`<button class="row" data-a="like" data-v="${k}" style="gap:4px;min-height:44px;color:${S.liked.has(k)?'var(--sec)':'var(--mut)'}">${I('heart',S.liked.has(k))}<b style="font-size:12px">${n+(S.liked.has(k)?1:0)}</b></button>`;
const list=PS.filter(p=>f=='Semua'||(f=='Di bawah Rp10k'&&p.cost&&p.cost<10000)||(f=='Info Warung Murah'&&p.type=='Info Warung')||(f=='Trik Kos'&&p.type=='Trik Masak'));
return `<div class="col" style="gap:12px"><div style="position:relative"><span class="cap" style="position:absolute;left:12px;top:11px">${I('search')}</span><input class="inp" id="qs" placeholder="Cari resep hemat atau warung dekat kampus..." style="padding-left:44px;min-height:46px" aria-label="Cari"></div>
<div class="hs" style="gap:8px;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px">${chips(['Semua','Di bawah Rp10k','Info Warung Murah','Trik Kos'],x=>S.tab==x,'ct')}</div>
<div class="card row sp" style="background:var(--sirup);box-shadow:none"><div class="row"><div class="av" style="width:40px;height:40px">${I('spark')}</div><div><div class="h h3" style="font-size:16px">Rekomendasi Hari Ini</div><div class="cap">Hemat rata-rata Rp18.500/hari anak kos</div></div></div><span class="bdg" style="background:color-mix(in srgb,var(--chili) 14%,transparent);color:var(--chili)">Depok &amp; Sekitarnya</span></div>
<div class="grid">${list.map(p=>post(p,L)).join('')||'<div class="card cap">Belum ada postingan di kategori ini.</div>'}</div></div>
<button class="btn fab" data-a="share">${I('plus')} Bagikan Resep / Info</button>`},
spots:()=>{const f=[...S.spot],l=SP.filter(s=>f.every(x=>s[5].includes(x)));return `<div class="row"><button class="av" style="background:var(--card);color:var(--ink);min-width:48px;min-height:48px" data-a="back" aria-label="Kembali">${I('back')}</button></div><div class="row wrap" style="margin:16px 0">${chips(['Nasi','Sayur','Protein','Buka sekarang'],x=>S.spot.has(x),'sp')}</div><div class="two r"><div class="map">${SP.map((s,i)=>`<div class="pin" style="left:${22+i*22}%;top:${28+(i%2)*34}%;color:${l.includes(s)?'var(--chili)':'#999'}"><span class="material-symbols-outlined" style="font-size:42px;font-variation-settings:'FILL' 1">location_on</span></div>`).join('')}<div style="position:absolute;left:44%;top:50%;width:18px;height:18px;border-radius:50%;background:#2563EB;border:3px solid #fff"></div></div><div class="col">${l.length?l.map(spot).join(''):'<div class="card cap">Belum ada tempat yang cocok. Kurangi filter.</div>'}</div></div>`},
akun:()=>{const w=S.hist.slice(-7),dk=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);return `<div class="two r"><div class="col"><div class="hero lt row" style="gap:18px"><div class="av" style="width:80px;height:80px;font-size:32px">D</div><div class="g"><h1 class="h h1">Dinda Aprilia</h1><div class="cap">Universitas Indonesia, Depok</div><span class="chip sw" style="background:var(--kunyit);color:#1C1A17;margin-top:6px">Lv.3 Anak Kos Pintar</span></div></div>
<div class="row">${[['12','Resep dibagi'],['34','Tersimpan'],['Rp148rb','Hemat bulan ini']].map(s=>`<div class="card g" style="text-align:center;padding:12px"><b class="m" style="font-size:20px;color:var(--daun)">${s[0]}</b><div class="cap">${s[1]}</div></div>`).join('')}</div>
<div class="card"><div class="row sp"><b>Pengeluaran vs budget</b><span class="cap m">garis = ${R(S.budget)}</span></div><div style="display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:14px;border-bottom:1px solid var(--bd);position:relative"><div style="position:absolute;left:0;right:0;bottom:${S.budget/20000*100}%;border-top:2px dashed var(--chili)"></div>${w.map(v=>`<div class="g" style="height:${Math.min(100,v/20000*100)}%;background:${v>S.budget?'var(--err)':v/S.budget>.7?'var(--kunyit)':'var(--daun)'};border-radius:8px 8px 0 0;position:relative"><span class="m" style="position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)">${Math.round(v/1000)}rb</span></div>`).join('')}</div></div>
<div class="row">${[['workspace_premium','Hemat Hero'],['local_fire_department','Spice Lord'],['shopping_basket','Pasar Hunter']].map(b=>`<div class="card g" style="text-align:center"><span class="material-symbols-outlined" style="font-size:38px;color:var(--sec);font-variation-settings:'FILL' 1">${b[0]}</span><b style="font-size:13px">${b[1]}</b></div>`).join('')}</div></div>
<div class="card col" style="align-self:start;gap:0;padding:6px 18px"><h2 class="h h2" style="padding:14px 0">Pengaturan</h2>${[['Dark mode',`<button data-a="theme" aria-label="Dark mode" style="width:52px;height:30px;border-radius:99px;background:${dk?'var(--daun)':'var(--bd)'};position:relative"><i style="position:absolute;top:3px;${dk?'right':'left'}:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s"></i></button>`],['Resep tersimpan','<a href="#/simpan" style="color:var(--chili);font-weight:700">Buka</a>'],['Budget harian','<b class="m">'+R(S.budget)+'</b>'],['Diet',[...S.pick].slice(0,2).join(', ')||'Belum diatur'],['Pengingat udah makan belum','<b class="m">19.00</b>']].map(x=>`<div class="row sp" style="min-height:54px;border-top:1px solid var(--bd)"><span>${x[0]}</span><span class="cap">${x[1]}</span></div>`).join('')}<button class="row" style="min-height:54px;border-top:1px solid var(--bd);color:#C62828;font-weight:700" data-a="go" data-v="#/welcome">Logout</button></div></div>`}};
const SP=[['Warung Bu Tini','250 m','06.00 sampai 21.00',9000,'4,7',['Nasi','Protein','Buka sekarang']],['Pasar Pagi Margonda','600 m','05.00 sampai 11.00',7500,'4,5',['Sayur','Protein']],['Tahu Tempe Pak Yanto','900 m','07.00 sampai 17.00',5000,'4,8',['Protein','Buka sekarang']],['Lapak Sayur Mbak Wati','1,1 km','06.00 sampai 15.00',4000,'4,6',['Sayur','Buka sekarang']]];
const spot=s=>`<div class="card row"><div class="g"><b>${s[0]}</b><div class="cap">${s[1]}, buka ${s[2]}</div><div class="row wrap" style="gap:12px;margin-top:4px"><b class="m" style="color:var(--chili)">±${R(s[3])}</b><span class="cap">Rating mahasiswa ${s[4]}/5</span></div></div><button class="btn s" data-a="toast" data-v="Membuka Google Maps">Buka Maps</button></div>`;
function render(){const h=location.hash||'#/welcome',[,p,id]=h.split('/');if(id)S.rid=+id;const k=p||'welcome',foc=['welcome','onboard','loading','cook','finish'].includes(k);
$('#sh').classList.toggle('focus',foc);const tabK={home:'explore',results:'explore',recipe:'explore',spots:'daftar belanja',belanja:'daftar belanja',simpan:'profil',akun:'profil'}[k]||k;
$('#sd').innerHTML=`<div class="row" style="gap:10px">${mascot(34)}<div style="line-height:1.15"><div class="bl">ShareA’Bite</div><div class="ht">${TT[k]||''}</div></div></div><div class="dn">${nav.map(n=>`<a class="nv ${n[1].toLowerCase()==tabK?'on':''}" href="${n[2]}">${I(n[0],n[1].toLowerCase()==tabK)}${n[1]}</a>`).join('')}</div><div class="row" style="gap:4px"><button class="ib" data-a="toast" data-v="Belum ada notifikasi baru" aria-label="Notifikasi">${I('bell')}</button><a class="av" style="width:36px;height:36px;font-size:14px;text-decoration:none" href="#/akun" aria-label="Profil">D</a></div>`;
$('#tb').innerHTML=nav.map(n=>{const on=n[1].toLowerCase()==tabK,c=S.cart.filter(x=>!x[5]).length;return `<a class="${on?'on':''}" href="${n[2]}"><span class="bw">${I(n[0],on)}${n[1]=='Daftar Belanja'&&c?`<b class="bg">${c}</b>`:''}</span>${n[1]}</a>`}).join('');
$('#v').innerHTML=(V[k]||V.welcome)();window.scrollTo(0,0);if(k=='loading')load();const sl=$('#sl');if(sl)sl.oninput=()=>setB(+sl.value,1);const qs=$('#qs');if(qs)qs.oninput=()=>document.querySelectorAll('[data-t]').forEach(a=>a.hidden=!a.dataset.t.toLowerCase().includes(qs.value.toLowerCase()))}
function count(a,b){const e=$('#bn');if(!e)return;const t0=performance.now();(function f(t){const q=Math.min(1,(t-t0)/350);e.textContent=R(a+(b-a)*q);if(q<1)requestAnimationFrame(f)})(t0)}
function setB(b,fromSl){const o=S.budget;S.budget=Math.max(5000,Math.min(50000,b));count(o,S.budget);const [c,l]=stat(9500,S.budget),h=$('#hs');if(h){h.textContent=l.toUpperCase();h.style.color=h.style.borderColor=c}if(!fromSl){const s=$('#sl');if(s)s.value=S.budget;document.querySelectorAll('[data-a=bs]').forEach(x=>x.classList.toggle('on',+x.dataset.v==S.budget))}}
function load(){const bar=$('#lp');let i=0;const T=[500,1300,2200];(function n(){if(location.hash!='#/loading')return;if(i<3){const e=$('#s'+i);e.style.opacity=1;e.firstElementChild.classList.add('on');bar.style.width=(i+1)*32+'%';setTimeout(()=>{i++;n()},T[i]-(T[i-1]||0)+250)}else{bar.style.width='100%';setTimeout(()=>location.hash='#/results',350)}})()}
let tmr;function stopT(){clearInterval(tmr);tmr=null}
function sheet(){$('#md').innerHTML=`<div class="modal" data-a="mc"><div class="sheet" role="dialog" aria-label="Share Post"><div class="row sp"><h2 class="h h2">Bagikan ke Komunitas</h2><button data-a="mc" aria-label="Tutup" style="min-width:44px;min-height:44px">${I('x')}</button></div><div class="pill" style="max-width:none">${['Resep','Tips','Tempat'].map((x,i)=>`<button class="${i?'':'on'}" data-a="toast" data-v="Mode ${x} dipilih">${x}</button>`).join('')}</div><div class="card" style="border:2px dashed var(--mut);text-align:center;color:var(--mut)">Tambah foto masakan</div><input class="inp" id="pt" placeholder="Judul resep"><div class="row"><input class="inp" placeholder="Waktu (mnt)"><input class="inp" placeholder="Porsi"></div><div class="row"><input class="inp" placeholder="Bahan"><input class="inp m" id="pp" inputmode="numeric" placeholder="Harga"></div><div class="row sp"><span class="cap">Total otomatis</span><span class="tag" id="pg">Rp0</span></div><div class="err" id="pe" style="color:#C62828;font-weight:700"></div><div class="row"><button class="btn gh g" data-a="toast" data-v="Draft tersimpan">Simpan draft</button><button class="btn g" data-a="post">Post</button></div></div></div>`;$('#pp').oninput=e=>$('#pg').textContent=R(+e.target.value.replace(/\D/g,''))}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.dataset.a=='mc'&&e.target!==el&&el.classList.contains('modal'))return;const a=el.dataset.a,v=el.dataset.v,rr=()=>{const y=scrollY;render();scrollTo(0,y)};
({go:()=>location.hash=v,back:()=>history.back(),guest:()=>{S.guest=true;location.hash='#/home'},next:()=>{S.step<3?(S.step++,render()):location.hash='#/home'},wk:()=>{S.budget=v/7;render()},pick:()=>{S.pick.has(v)?S.pick.delete(v):S.pick.add(v);rr()},bd:()=>setB(S.budget+ +v),bs:()=>setB(+v),gen:()=>location.hash='#/loading',toast:()=>toast(v),
save:()=>{const id=+v;S.saved.has(id)?(S.saved.delete(id),toast('Dihapus dari Simpan')):(S.saved.add(id),toast('Tersimpan. Hemat banget!'));rr()},
td:()=>{S.tabD=v;rr()},cart:()=>{rec(v).ing.forEach(x=>{const m=S.cart.find(c=>c[0]==x[0]&&c[2]==x[2]);m?(m[1]+=x[1],m[3]+=x[3]):S.cart.push([x[0],x[1],x[2],x[3],x[4],0])});toast('Bahan masuk ke Belanja');},
cook:()=>{S.si=0;location.hash='#/cook/'+v},step:()=>{stopT();S.si<rec(S.rid).st.length-1?(S.si++,render()):location.hash='#/finish/'+S.rid},prev:()=>{stopT();S.si--;render()},
timer:()=>{if(tmr)return;let t=+v;const x=$('#tx');tmr=setInterval(()=>{t--;x.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(t<=0){stopT();navigator.vibrate&&navigator.vibrate(300);toast('Timer selesai!')}},1000)},
log:()=>{S.hist.push(+$('#sp').value.replace(/\D/g,'')||0);toast('Tercatat. Dompet aman!');location.hash='#/akun'},
chk:()=>{S.cart[v][5]^=1;rr()},ct:()=>{S.tab=v;rr()},like:()=>{S.liked.has(v)?S.liked.delete(v):S.liked.add(v);rr()},sp:()=>{S.spot.has(v)?S.spot.delete(v):S.spot.add(v);rr()},
theme:()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';rr()},
share:sheet,mc:()=>$('#md').innerHTML='',post:()=>{const t=$('#pt').value.trim();if(!t){$('#pe').textContent='Judulnya jangan kosong ya.';return}$('#md').innerHTML='';toast('Postingan terkirim!')}})[a]?.()});
addEventListener('hashchange',()=>{stopT();render()});render();
</script></body></html>
