loading:()=>`<div class="col" style="align-items:center;text-align:center;margin:24px 0 0;gap:18px"><div id="lm">${mascot(170,'cook')}</div><h1 class="h h1" id="lt">Lagi masak ide buat kamu...</h1><div class="card" style="width:100%;text-align:left"><div class="col" id="ls" style="gap:12px">${['Cek harga pasar Depok','Pilih bahan sesuai alat masak','Hitung struk, pastikan '+R(S.budget)+' cukup'].map((x,i)=>`<div class="row" id="s${i}" style="opacity:.4"><div class="ck">${I('check')}</div>${x}</div>`).join('')}</div><div class="bar" style="margin-top:16px"><i id="lp" style="width:4%;background:var(--chili)"></i></div></div><div class="sticky" style="width:100%;text-align:left">Tips: telur dadar plus nasi hangat itu kombo paling aman buat akhir bulan.</div><button class="btn gh s" data-a="go" data-v="#/home">Batal</button></div>`,

<div class="card row sp" style="background:var(--sirup);box-shadow:none"><div class="row"><div class="av" style="width:40px;height:40px">${I('spark')}</div><div><div class="h h3" style="font-size:16px">Rekomendasi Hari Ini</div><div class="cap">Hemat rata-rata Rp18.500/hari anak kos</div></div></div><span class="bdg" style="background:color-mix(in srgb,var(--chili) 14%,transparent);color:var(--chili)">Depok &amp; Sekitarnya</span></div>
